name: CDN

# Copies every published release to cdn.prozesshub.eu, where the README and
# dpa.plus/satz link: GitHub's release downloads are slow on some networks.
# Each version gets its own folder that never changes; latest/ follows the
# newest release that is not a pre-release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to copy, for example v0.4.3
        required: true

permissions:
  contents: read

concurrency:
  group: cdn
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      TARGET: r2:cdn/assets/clients/dpa/downloads/satz
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_REGION: auto
    steps:
      - name: Install rclone
        run: sudo apt-get update -q && sudo apt-get install -yq rclone
      - name: Download the release
        run: >
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --dir release
          --pattern 'satz-mac*' --pattern 'satz-windows-*.zip' --pattern 'satz-linux-*' --pattern 'appcast.xml' --pattern 'SHA256SUMS.txt'
      - name: Check the files
        # The source archive stays on GitHub only, so its line is left out.
        working-directory: release
        run: grep -v -- '-source\.' SHA256SUMS.txt | sha256sum --check
      - name: Write the release manifest
        # dpa.plus/satz reads the version and the file sizes from this, so
        # its download list follows every release without a site deploy. A
        # script, not JSON, because the CDN sends no CORS headers.
        run: |
          mkdir -p meta
          python3 - <<'PY'
          import json, os
          files = {f: os.path.getsize(os.path.join('release', f)) for f in sorted(os.listdir('release')) if f.startswith('satz-') and '-source.' not in f}
          data = {'version': os.environ['TAG'], 'files': files}
          compact = json.dumps(data, separators=(',', ':'))
          with open('meta/release.json', 'w') as out:
              out.write(json.dumps(data, indent=1) + '\n')
          with open('meta/release.js', 'w') as out:
              out.write('window.satzRelease=' + compact + ';window.satzReleaseFertig&&window.satzReleaseFertig(window.satzRelease);\n')
          PY
          cat meta/release.json
      - name: Copy to the version folder
        run: |
          rclone copy release "$TARGET/$TAG" --s3-no-check-bucket --transfers 8 --header-upload "Cache-Control: public, max-age=31536000, immutable"
          rclone copy meta "$TARGET/$TAG" --s3-no-check-bucket --header-upload "Cache-Control: public, max-age=31536000, immutable"
      - name: Copy to latest
        # Short cache, because these names are replaced with every release.
        run: |
          if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)" = "true" ]; then
            echo "Pre-release: latest/ stays as it is."
            exit 0
          fi
          rclone copy release "$TARGET/latest" --s3-no-check-bucket --transfers 8 --header-upload "Cache-Control: public, max-age=300"
          # The manifest last: it must never name files latest/ does not have yet.
          rclone copy meta "$TARGET/latest" --s3-no-check-bucket --header-upload "Cache-Control: public, max-age=300"
