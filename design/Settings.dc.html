<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #ffeade; }
    a { color: #16303c; text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: #ff6100; }
  </style>
</helmet>
<div style="width: 520px; min-height: 1060px; box-sizing: border-box; background: #ffeade; color: #16303c; font-family: 'Source Sans 3', -apple-system, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column;">

  <div style="height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 14px;">
    <div style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.15);"></div>
    <div style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.15);"></div>
    <div style="width: 12px; height: 12px; border-radius: 50%; background: #28c840; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.15);"></div>
  </div>

  <div style="padding: 10px 32px 36px; display: flex; flex-direction: column; gap: 26px;">

    <h1 style="margin: 0; font-family: 'Bitter', Georgia, serif; font-weight: 600; font-size: 26px; letter-spacing: -0.03em;">Einstellungen</h1>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-family: 'Bitter', Georgia, serif; font-size: 17px; font-weight: 600; letter-spacing: -0.02em;">Kurzbefehl</div>
      <div style="background: #ffffff; border: 1.5px solid #16303c; border-radius: 16px; display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px;">
          <div style="width: 18px; height: 18px; flex-shrink: 0; border-radius: 50%; border: 2px solid #ff6100; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><div style="width: 8px; height: 8px; border-radius: 50%; background: #ff6100;"></div></div>
          <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; border: 1.5px solid #16303c; border-radius: 7px; padding: 0 7px; line-height: 20px;">⌘ <span style="font-weight: 500;">cmd</span></span>
          <div style="font-size: 15px;">rechts, zweimal</div>
        </div>
        <div style="height: 1.5px; background: rgba(22,48,60,0.12);"></div>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px;">
          <div style="width: 18px; height: 18px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid #16303c; box-sizing: border-box;"></div>
          <div style="font-size: 15px;">Mikrofontaste</div>
        </div>
        <div style="height: 1.5px; background: rgba(22,48,60,0.12);"></div>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px;">
          <div style="width: 18px; height: 18px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid #16303c; box-sizing: border-box;"></div>
          <div style="font-size: 15px;">Eigene Tasten</div>
          <button style="margin-left: auto; font-family: 'Source Sans 3', -apple-system, Arial, sans-serif; font-size: 13px; font-weight: 600; color: #16303c; background: #ffffff; border: 1.5px solid rgba(22,48,60,0.55); border-radius: 8px; padding: 3px 10px;">Aufnehmen</button>
        </div>
        <div style="height: 1.5px; background: rgba(22,48,60,0.12);"></div>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px;">
          <div style="width: 18px; height: 18px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid #16303c; box-sizing: border-box;"></div>
          <div style="font-size: 15px;">Maustaste</div>
          <button style="margin-left: auto; font-family: 'Source Sans 3', -apple-system, Arial, sans-serif; font-size: 13px; font-weight: 600; color: #16303c; background: #ffffff; border: 1.5px solid rgba(22,48,60,0.55); border-radius: 8px; padding: 3px 10px;">Aufnehmen</button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; background: rgba(22,48,60,0.08); border-radius: 10px; padding: 3px;">
        <div style="text-align: center; font-size: 14px; font-weight: 600; color: #16303c; padding: 5px 0; background: #ffffff; border: 1.5px solid #16303c; border-radius: 8px;">Tippen</div>
        <div style="text-align: center; font-size: 14px; font-weight: 600; color: #40545c; padding: 6px 0;">Halten</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-family: 'Bitter', Georgia, serif; font-size: 17px; font-weight: 600; letter-spacing: -0.02em;">Mikrofon</div>
      <div style="background: #ffffff; border: 1.5px solid #16303c; border-radius: 16px; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px;">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600;">
          Headset
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#16303c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"></path></svg>
        </div>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 3px; height: 18px;">
          <div style="width: 4px; height: 6px; border-radius: 2px; background: #ff6100;"></div>
          <div style="width: 4px; height: 10px; border-radius: 2px; background: #ff6100;"></div>
          <div style="width: 4px; height: 15px; border-radius: 2px; background: #ff6100;"></div>
          <div style="width: 4px; height: 12px; border-radius: 2px; background: #ff6100;"></div>
          <div style="width: 4px; height: 18px; border-radius: 2px; background: #ff6100;"></div>
          <div style="width: 4px; height: 9px; border-radius: 2px; background: #ff6100;"></div>
          <div style="width: 4px; height: 6px; border-radius: 2px; background: rgba(22,48,60,0.2);"></div>
          <div style="width: 4px; height: 6px; border-radius: 2px; background: rgba(22,48,60,0.2);"></div>
          <div style="width: 4px; height: 6px; border-radius: 2px; background: rgba(22,48,60,0.2);"></div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-family: 'Bitter', Georgia, serif; font-size: 17px; font-weight: 600; letter-spacing: -0.02em;">Anbieter</div>
      <div style="background: #ffffff; border: 1.5px solid #16303c; border-radius: 16px; display: flex; flex-direction: column;">
        <div style="padding: 10px;">
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; background: rgba(22,48,60,0.08); border-radius: 10px; padding: 3px;">
            <div style="text-align: center; font-size: 14px; font-weight: 600; color: #40545c; padding: 6px 0;">OpenAI</div>
            <div style="text-align: center; font-size: 14px; font-weight: 600; color: #16303c; padding: 5px 0; background: #ffffff; border: 1.5px solid #16303c; border-radius: 8px;">OpenRouter</div>
            <div style="text-align: center; font-size: 14px; font-weight: 600; color: #40545c; padding: 6px 0;">Groq</div>
            <div style="text-align: center; font-size: 14px; font-weight: 600; color: #40545c; padding: 6px 0;">Eigener</div>
          </div>
        </div>
        <div style="height: 1.5px; background: rgba(22,48,60,0.12);"></div>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px;">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#16303c" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="7" width="10" height="7" rx="2"></rect><path d="M5.5 7V5a2.5 2.5 0 015 0v2"></path></svg>
          <div style="font-size: 15px;">Schlüssel</div>
          <button style="margin-left: auto; font-family: 'Source Sans 3', -apple-system, Arial, sans-serif; font-size: 13px; font-weight: 600; color: #16303c; background: #ffffff; border: 1.5px solid rgba(22,48,60,0.55); border-radius: 8px; padding: 3px 10px;">Ändern</button>
        </div>
        <div style="height: 1.5px; background: rgba(22,48,60,0.12);"></div>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px;">
          <div style="font-size: 15px;">Modell</div>
          <div style="margin-left: auto; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px; color: #5d7078;">openai/gpt-transcribe</div>
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#16303c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"></path></svg>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-family: 'Bitter', Georgia, serif; font-size: 17px; font-weight: 600; letter-spacing: -0.02em;">Wortschatz</div>
      <div style="background: #ffffff; border: 1.5px solid #16303c; border-radius: 16px; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 6px; border: 1.5px solid #16303c; border-radius: 999px; padding: 3px 6px 3px 12px; font-size: 14px;">ACON <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#40545c" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l6 6M11 5l-6 6"></path></svg></div>
        <div style="display: flex; align-items: center; gap: 6px; border: 1.5px solid #16303c; border-radius: 999px; padding: 3px 6px 3px 12px; font-size: 14px;">Immofanten <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#40545c" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l6 6M11 5l-6 6"></path></svg></div>
        <div style="display: flex; align-items: center; gap: 6px; border: 1.5px solid #16303c; border-radius: 999px; padding: 3px 6px 3px 12px; font-size: 14px;">Prozesshub <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#40545c" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l6 6M11 5l-6 6"></path></svg></div>
        <div style="display: flex; align-items: center; border: 1.5px dashed rgba(22,48,60,0.55); border-radius: 999px; padding: 3px 12px; font-size: 14px; color: #40545c;">+ Wort</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-family: 'Bitter', Georgia, serif; font-size: 17px; font-weight: 600; letter-spacing: -0.02em;">Allgemein</div>
      <div style="background: #ffffff; border: 1.5px solid #16303c; border-radius: 16px; display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px;">
          <div style="font-size: 15px;">Bei Anmeldung starten</div>
          <div style="margin-left: auto; width: 38px; height: 22px; border-radius: 11px; background: #ff6100; position: relative;"><div style="position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 2px rgba(22,48,60,0.3);"></div></div>
        </div>
        <div style="height: 1.5px; background: rgba(22,48,60,0.12);"></div>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px;">
          <div style="font-size: 15px;">Verlauf</div>
          <button style="margin-left: auto; font-family: 'Source Sans 3', -apple-system, Arial, sans-serif; font-size: 13px; font-weight: 600; color: #16303c; background: #ffffff; border: 1.5px solid rgba(22,48,60,0.55); border-radius: 8px; padding: 3px 10px;">Leeren</button>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>

</html>
